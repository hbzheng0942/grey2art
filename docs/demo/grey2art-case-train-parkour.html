<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Train Parkour / Grey2Art case comparison</title><style>
@font-face{font-family:'Grey2Art Sans';src:url('fonts/NotoSansCJKsc-2.004-showcase-subset.woff2') format('woff2');font-weight:400;font-display:block}
*{box-sizing:border-box}html,body{margin:0;width:100%;background:#0d0d11;color:#f5f2eb;overflow-x:hidden}
body{font-family:'Grey2Art Sans','Noto Sans SC','PingFang SC',sans-serif;-webkit-font-smoothing:antialiased}
main{width:1000px;height:707px;padding:20px}
header{height:46px;margin-bottom:10px;display:flex;align-items:baseline;justify-content:space-between}
h1{font-size:28px;font-weight:600;letter-spacing:-.6px;margin:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
figure{margin:0;background:#19181f;min-width:0}
.viewport{aspect-ratio:16 / 9;overflow:hidden}
img{display:block;height:100%;width:100%;object-fit:cover}
figcaption{height:32px;display:flex;align-items:center;gap:12px;padding:0 11px;white-space:nowrap}
figcaption b{font-size:15px;font-weight:400}
</style><main><header><h1>Train Parkour</h1></header>
<div class="grid"><figure class="fit-to-tile"><div class="viewport"><img src="train-greybox-native.jpg" alt="Train Parkour: Gameplay greybox" style=""></div><figcaption><b>Gameplay greybox</b></figcaption></figure><figure class="fit-to-tile"><div class="viewport"><img src="train-clay-native.jpg" alt="Train Parkour: Colorful clay" style=""></div><figcaption><b>Colorful clay</b></figcaption></figure><figure class="fit-to-tile"><div class="viewport"><img src="train-pixel-native.jpg" alt="Train Parkour: Pixel skyline" style=""></div><figcaption><b>Pixel skyline</b></figcaption></figure><figure class="fit-to-tile"><div class="viewport"><img src="train-halloween-native.jpg" alt="Train Parkour: Halloween comic" style=""></div><figcaption><b>Halloween comic</b></figcaption></figure></div></main>
<script>
function fitPreview() {
  const scale = Math.min(1, innerWidth / 1000);
  document.querySelector('main').style.zoom = scale;
  document.body.style.height = `${707 * scale}px`;
  document.documentElement.dataset.previewOverflow = String(document.documentElement.scrollWidth > innerWidth);
}
addEventListener('resize', fitPreview); fitPreview();
document.fonts.ready.then(() => {
  document.documentElement.dataset.fontStatus = [...document.fonts].some(font => font.family === 'Grey2Art Sans' && font.status === 'loaded') ? 'loaded' : 'error';
  document.documentElement.dataset.labelOverflow = String([...document.querySelectorAll('figcaption')].some(caption => caption.scrollWidth > caption.clientWidth));
});
</script></html>
