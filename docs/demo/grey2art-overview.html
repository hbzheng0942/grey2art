<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Grey2Art · From One Greybox to Multistyle Art</title><style>
@font-face{font-family:'Grey2Art Sans';src:url('fonts/NotoSansCJKsc-2.004-showcase-subset.woff2') format('woff2');font-weight:400;font-display:block}
*{box-sizing:border-box}html,body{margin:0;width:100%;background:#0d0d11;color:#f5f2eb;overflow-x:hidden}
body{font-family:'Grey2Art Sans','Noto Sans SC',sans-serif;-webkit-font-smoothing:antialiased}main{width:1800px;height:1226px;padding:28px 40px 20px}
.masthead{height:110px;display:flex;align-items:flex-start;gap:34px;border-bottom:1px solid #32313a;margin-bottom:16px}
.identity{white-space:nowrap;display:flex;align-items:center;gap:18px;padding-top:7px}
.mark{display:grid;grid-template-columns:repeat(3,11px);grid-template-rows:repeat(3,11px);gap:3px;transform:translateY(1px)}
.mark i{display:block;background:#575661}.mark i:nth-child(3){background:#fc70bb}.mark i:nth-child(5){background:#aff38a}.mark i:nth-child(6){background:#7bc8ff}.mark i:nth-child(8){background:#ffcc66}.mark i:nth-child(9){background:#e8e4dc}
.brand{font-size:64px;font-weight:600;line-height:1;letter-spacing:-3px;margin:0}.brand span{color:#fc70bb}
.pitch{padding-top:1px;margin-left:12px}.pitch h1{font-weight:600;font-size:30px;line-height:1.24;margin:0 0 9px;letter-spacing:-.7px}
.pitch p{font-size:15px;line-height:1.4;color:#a5a0b0;margin:0}.meta{margin-left:auto;font-size:12px;line-height:1.9;color:#a5a0b0;text-align:right;padding-top:8px}.meta b{color:#fc70bb;font-weight:600}
.columns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;height:24px;margin-bottom:10px;font-size:13px;letter-spacing:1px;color:#c8c1d2}.columns span:first-child{color:#b8b4c1}.columns span:not(:first-child){color:#fc70bb}
.row{margin-bottom:14px}.rowhead{display:flex;align-items:center;height:28px;margin-bottom:6px;gap:13px}.rowhead b{font-size:12px;font-weight:400;color:#fc70bb}.rowhead h2{font-weight:600;font-size:21px;margin:0}.rowhead p{font-size:13px;color:#9691a2;margin:0 0 0 auto}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.tile{margin:0;background:#19181f;min-width:0}.viewport{aspect-ratio:var(--frame-aspect);overflow:hidden;position:relative}.viewport img{display:block;height:100%;width:100%;object-fit:cover}

figcaption{height:32px;padding:7px 11px;font-size:14px;color:#e6e1ec;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.placeholder .viewport{background:repeating-conic-gradient(#15141c 0% 25%,#1c1a23 0% 50%) 50%/40px 40px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px dashed #777080}
.pendingmark{font-size:58px;color:#81778d;line-height:1;margin-bottom:20px}.pendingtext{font-size:18px;color:#e0c9e9;text-align:center;line-height:1.6}.placeholder figcaption{color:#c8a2d5}
footer{display:flex;justify-content:space-between;gap:20px;border-top:1px solid #32313a;padding-top:14px;margin-top:14px;color:#aaa3b6;font-size:12px;line-height:1.5}
</style><main><header class="masthead"><div class="identity"><div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><p class="brand">Grey2Art<span>.</span></p></div><div class="pitch"><h1>From one greybox<br>to multistyle art.</h1><p>Batch-create editable, playable art prototypes.</p></div></header><div class="columns"><span>GREYBOX / INPUT</span><span>ART WORLD 01</span><span>ART WORLD 02</span><span>ART WORLD 03</span></div><section class="row" id="hole" style="--frame-aspect:3 / 2"><div class="rowhead"><b>01</b><h2>Hole</h2><p>Top-down collection</p></div><div class="grid"><figure class="tile reference-frame"><div class="viewport"><img src="hole-reference-greybox.png" alt="Hole: Gameplay greybox"></div><figcaption>Gameplay greybox</figcaption></figure><figure class="tile reference-frame"><div class="viewport"><img src="hole-ceramic-selected-native.png" alt="Hole: Ceramic town"></div><figcaption>Ceramic town</figcaption></figure><figure class="tile reference-frame"><div class="viewport"><img src="hole-orbital-selected-native.png" alt="Hole: Orbital sci-fi"></div><figcaption>Orbital sci-fi</figcaption></figure><figure class="tile reference-frame"><div class="viewport"><img src="hole-reference-mycelium.png" alt="Hole: Mushroom forest"></div><figcaption>Mushroom forest</figcaption></figure></div></section><section class="row" id="train-parkour" style="--frame-aspect:16 / 9"><div class="rowhead"><b>02</b><h2>Train Parkour</h2><p>Continuous 3D action</p></div><div class="grid"><figure class="tile "><div class="viewport"><img src="train-greybox-native.jpg" alt="Train Parkour: Gameplay greybox"></div><figcaption>Gameplay greybox</figcaption></figure><figure class="tile "><div class="viewport"><img src="train-clay-native.jpg" alt="Train Parkour: Colorful clay"></div><figcaption>Colorful clay</figcaption></figure><figure class="tile "><div class="viewport"><img src="train-pixel-native.jpg" alt="Train Parkour: Pixel skyline"></div><figcaption>Pixel skyline</figcaption></figure><figure class="tile "><div class="viewport"><img src="train-halloween-native.jpg" alt="Train Parkour: Halloween comic"></div><figcaption>Halloween comic</figcaption></figure></div></section><section class="row" id="wander-garden" style="--frame-aspect:8 / 5"><div class="rowhead"><b>03</b><h2>Wander Garden</h2><p>Third-person farming</p></div><div class="grid"><figure class="tile "><div class="viewport"><img src="garden-greybox-native.png" alt="Wander Garden: Gameplay greybox"></div><figcaption>Gameplay greybox</figcaption></figure><figure class="tile "><div class="viewport"><img src="garden-original-native.png" alt="Wander Garden: Original low-poly"></div><figcaption>Original low-poly</figcaption></figure><figure class="tile "><div class="viewport"><img src="garden-ink-native.png" alt="Wander Garden: Ink storybook"></div><figcaption>Ink storybook</figcaption></figure><figure class="tile "><div class="viewport"><img src="garden-halloween-native.png" alt="Wander Garden: Pumpkin moon"></div><figcaption>Pumpkin moon</figcaption></figure></div></section></main><script>
function fitPreview() {
  const scale = Math.min(1, innerWidth / 1800);
  document.querySelector('main').style.zoom = scale;
  document.body.style.height = `${1226 * scale}px`;
  document.documentElement.dataset.previewOverflow = String(document.documentElement.scrollWidth > innerWidth);
}
addEventListener('resize', fitPreview); fitPreview();
document.fonts.ready.then(() => {
  document.documentElement.dataset.fontStatus =
    [...document.fonts].some(font => font.family === 'Grey2Art Sans' && font.status === 'loaded')
      ? 'loaded' : 'error';
});
</script></html>
