name: Verify Skill

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  portable:
    name: Install and offline metrics (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check_release.py
      - run: python -m unittest discover -s tests -p test_portable_install.py -v
      - run: python -m unittest discover -s tests -p test_asset_metrics.py -v
      - run: python -m unittest discover -s tests -p test_release_package.py -v
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
  executor-portability:
    name: Executor process and recovery tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -p test_process_locking.py -v
      - run: python -m unittest discover -s tests -p test_execution_core.py -v
      - run: python -m unittest discover -s tests -p test_supplier_execution.py -v
      - run: python -m unittest discover -s tests -p test_supplier_jobs_r31.py -v
  package:
    name: Build verified Skill package
    needs: [portable, regression, executor-portability]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python scripts/build_release.py build --ref "${{ github.sha }}" --verify-install
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grey2art-skill-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.zip.release.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
